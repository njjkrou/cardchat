<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1420"/><stop offset="100%" stop-color="#171d2b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b5cff"/><stop offset="100%" stop-color="#5f8bff"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5c8a"/><stop offset="100%" stop-color="#ff8fb1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f9d6b"/><stop offset="100%" stop-color="#3fc98d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b8c"/>
    </marker>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e8eefc" font-size="24" font-weight="700">藏春阁 · 系统架构</text>
  <text x="40" y="78" fill="#7f8db0" font-size="14">CardChat — Multi-tenant AI Character Chat Platform</text>

  <!-- 客户端 -->
  <rect x="40" y="110" width="250" height="150" rx="16" fill="#1b2334" stroke="#33415f"/>
  <text x="60" y="140" fill="#9fb2d6" font-size="15" font-weight="600">客户端 Clients</text>
  <rect x="60" y="156" width="210" height="38" rx="9" fill="url(#blue)" opacity="0.9"/>
  <text x="165" y="180" fill="#fff" font-size="14" text-anchor="middle">用户端 Vue 3 SPA</text>
  <rect x="60" y="202" width="210" height="38" rx="9" fill="#243149" stroke="#3b4c6e"/>
  <text x="165" y="226" fill="#c8d5f0" font-size="14" text-anchor="middle">管理后台 Vue 3</text>

  <!-- nginx -->
  <rect x="330" y="130" width="130" height="110" rx="14" fill="#1b2334" stroke="#33415f"/>
  <text x="395" y="172" fill="#c8d5f0" font-size="14" text-anchor="middle">Nginx</text>
  <text x="395" y="196" fill="#7f8db0" font-size="12" text-anchor="middle">反代 / 静态</text>

  <!-- 服务 -->
  <rect x="500" y="100" width="300" height="330" rx="18" fill="#141b29" stroke="#2d3b57"/>
  <text x="520" y="132" fill="#9fb2d6" font-size="15" font-weight="600">Node.js 服务（Express）</text>
  <g font-size="12.5" fill="#d6e0f5">
    <rect x="520" y="146" width="120" height="34" rx="8" fill="#22304a"/><text x="580" y="168" text-anchor="middle">JWT 认证</text>
    <rect x="652" y="146" width="128" height="34" rx="8" fill="#22304a"/><text x="716" y="168" text-anchor="middle">Prompt 引擎</text>
    <rect x="520" y="188" width="120" height="34" rx="8" fill="url(#pink)" opacity="0.85"/><text x="580" y="210" text-anchor="middle" fill="#fff">记忆系统</text>
    <rect x="652" y="188" width="128" height="34" rx="8" fill="#22304a"/><text x="716" y="210" text-anchor="middle">世界书 / 正则</text>
    <rect x="520" y="230" width="120" height="34" rx="8" fill="#22304a"/><text x="580" y="252" text-anchor="middle">计费 / 账本</text>
    <rect x="652" y="230" width="128" height="34" rx="8" fill="#22304a"/><text x="716" y="252" text-anchor="middle">订阅 / 支付</text>
    <rect x="520" y="272" width="120" height="34" rx="8" fill="#22304a"/><text x="580" y="294" text-anchor="middle">自动消息调度</text>
    <rect x="652" y="272" width="128" height="34" rx="8" fill="#22304a"/><text x="716" y="294" text-anchor="middle">媒体 / 上传</text>
    <rect x="520" y="314" width="260" height="34" rx="8" fill="#22304a"/><text x="650" y="336" text-anchor="middle">多租户 · 限流 · 内容审核</text>
  </g>
  <rect x="520" y="360" width="260" height="52" rx="10" fill="url(#green)" opacity="0.85"/>
  <text x="650" y="382" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">SQLite（WAL）</text>
  <text x="650" y="400" fill="#d8f5e6" font-size="11.5" text-anchor="middle">单文件数据库 · FTS5 全文检索</text>

  <!-- 外部 -->
  <rect x="850" y="100" width="190" height="330" rx="16" fill="#1b2334" stroke="#33415f"/>
  <text x="945" y="130" fill="#9fb2d6" font-size="15" font-weight="600" text-anchor="middle">外部服务</text>
  <g font-size="12.5" fill="#c8d5f0">
    <rect x="866" y="146" width="158" height="40" rx="8" fill="#243149"/><text x="945" y="171" text-anchor="middle">LLM 网关（OpenAI 兼容）</text>
    <rect x="866" y="196" width="158" height="40" rx="8" fill="#243149"/><text x="945" y="221" text-anchor="middle">图片 / 视频模型</text>
    <rect x="866" y="246" width="158" height="40" rx="8" fill="#243149"/><text x="945" y="271" text-anchor="middle">联网搜索</text>
    <rect x="866" y="296" width="158" height="40" rx="8" fill="#243149"/><text x="945" y="321" text-anchor="middle">易支付 / 回调</text>
    <rect x="866" y="346" width="158" height="40" rx="8" fill="#243149"/><text x="945" y="371" text-anchor="middle">用户自有 API Key</text>
  </g>

  <!-- 连接线 -->
  <g stroke="#5b6b8c" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 290 185 L 322 185"/>
    <path d="M 460 185 L 492 185"/>
    <path d="M 800 200 L 842 200"/>
    <path d="M 800 280 L 842 280"/>
  </g>

  <!-- 说明 -->
  <text x="40" y="330" fill="#7f8db0" font-size="13">一次请求的数据流：</text>
  <text x="40" y="356" fill="#a9b8d6" font-size="12.5">1. 前端经 Nginx 调用 /api</text>
  <text x="40" y="380" fill="#a9b8d6" font-size="12.5">2. 服务端鉴权 → 组装 Prompt（角色卡 + 世界书 + 预设 + 记忆）</text>
  <text x="40" y="404" fill="#a9b8d6" font-size="12.5">3. 按预算切分历史，注入长期记忆，调用 LLM 网关</text>
  <text x="40" y="428" fill="#a9b8d6" font-size="12.5">4. 流式回传，按 usage 结算爱心并写入账本</text>
  <text x="40" y="452" fill="#a9b8d6" font-size="12.5">5. 异步：分段摘要、事实抽取、自动消息调度</text>

  <text x="40" y="600" fill="#5d6b8c" font-size="12">本仓库仅包含前端构建产物；后端服务未开源，此图用于说明系统构成。</text>
</svg>
